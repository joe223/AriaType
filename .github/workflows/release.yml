name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

env:
  LLAMA_CPP_RELEASE_TAG: b9568

# Builds macOS and Windows installers in parallel, publishes them to the
# GitHub release for this repository, then deploys the website with download
# links pointing to GitHub Releases.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN      — Cloudflare API token (Pages deploy)
#   CLOUDFLARE_ACCOUNT_ID     — Cloudflare account ID
#   HOMEBREW_TAP_TOKEN        — GitHub PAT with `repo` scope on ariatype/homebrew-ariatype
#   APPLE_CERTIFICATE         — base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD — password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY    — e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                  — Apple ID email
#   APPLE_PASSWORD            — App-Specific Password from appleid.apple.com
#   APPLE_TEAM_ID             — 10-character Team ID
#   TAURI_SIGNING_PRIVATE_KEY — Tauri updater private signing key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Optional password for the Tauri updater private key
#   TAURI_UPDATER_PUBKEY      — Public key embedded in the app for update signature checks

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/desktop/src-tauri/tauri.conf.json

      - name: Prepare llama.cpp local polish runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/llama-server-assets
          gh release download "$LLAMA_CPP_RELEASE_TAG" \
            --repo ggml-org/llama.cpp \
            --pattern '*macos*arm64*' \
            --pattern '*macos*x64*' \
            --dir .tmp/llama-server-assets
          node scripts/prepare-llama-server-release-assets.mjs \
            --platform macos \
            --assets-dir .tmp/llama-server-assets

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build universal macOS DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ARIATYPE_REQUIRE_LOCAL_POLISH_RUNTIME: "1"
        run: pnpm tauri:build:mac-universal

      - name: Verify bundled local polish runtimes
        run: node scripts/verify-tauri-runtime-resources.mjs --platform macos --smoke --smoke-timeout-ms 30000

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 1

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp apps/desktop/src-tauri/tauri.conf.json

      - name: Prepare llama.cpp local polish runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/llama-server-assets
          gh release download "$LLAMA_CPP_RELEASE_TAG" \
            --repo ggml-org/llama.cpp \
            --pattern '*win*cpu*x64*' \
            --dir .tmp/llama-server-assets
          node scripts/prepare-llama-server-release-assets.mjs \
            --platform windows \
            --assets-dir .tmp/llama-server-assets

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ARIATYPE_REQUIRE_LOCAL_POLISH_RUNTIME: "1"
        run: pnpm tauri:build:win

      - name: Verify bundled local polish runtime
        shell: bash
        run: node scripts/verify-tauri-runtime-resources.mjs --platform windows --smoke --smoke-timeout-ms 30000

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig
          retention-days: 1

  # ── Publish ────────────────────────────────────────────────────────────────
  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist/

      - name: Generate GitHub release manifests
        run: |
          git log -1 --pretty=%B > /tmp/ariatype-release-notes.md
          node scripts/generate-release-manifests.mjs \
            --release-dir dist \
            --version "${{ env.VERSION }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}" \
            --notes-file /tmp/ariatype-release-notes.md \
            --require-updater \
            --require-updater-platform darwin-aarch64 \
            --require-updater-platform darwin-x86_64 \
            --require-updater-platform windows-x86_64

      - name: Create release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ env.VERSION }} dist/* \
            --repo ${{ github.repository }} \
            --title "AriaType v${{ env.VERSION }}" \
            --notes-file /tmp/ariatype-release-notes.md

      # Update Homebrew Cask formula in ariatype/homebrew-ariatype tap.
      # The tap repo must contain Casks/ariatype.rb with version/sha256 placeholders.
      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          DMG=$(find dist -name "*.dmg" | head -1)
          SHA256=$(sha256sum "$DMG" | awk '{print $1}')
          VERSION=${{ env.VERSION }}

          git clone https://x-access-token:${GH_TOKEN}@github.com/ariatype/homebrew-ariatype.git /tmp/homebrew-ariatype
          cd /tmp/homebrew-ariatype

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/ariatype.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/ariatype.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ariatype.rb
          git commit -m "Update AriaType to ${VERSION}"
          git push

      - name: Build website
        run: pnpm --filter @ariatype/website build

      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ariatype-website
          directory: packages/website/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
